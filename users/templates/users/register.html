{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
{% include 'header.html' with header_title="Регистрация" header_lead="!!! В разработке !!!" %}
<div class="container" style="max-width: 500px;">

    <form method="post" novalidate>
        <!-- Токен защиты Django от подделки запросов (обязателен!) -->
        {% csrf_token %}

        <!-- Вывод полей формы в виде параграфов. Django сам добавит теги <input> и <label> -->
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary mt-3">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
