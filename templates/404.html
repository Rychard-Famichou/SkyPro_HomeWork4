{% extends 'base.html' %}

{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-8 col-lg-6">
            <!-- Иконка-предупреждение -->
            <div class="mb-4">
                <svg xmlns="http://w3.org" width="80" height="80" fill="currentColor" class="text-danger bi bi-exclamation-triangle-fill animate__animated animate__bounceIn" viewBox="0 0 16 16">
                    <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                </svg>
            </div>
            
            <!-- Большой заголовок -->
            <h1 class="display-1 fw-bold text-dark mb-2">404</h1>
            
            <!-- Текст ошибки -->
            <h2 class="h4 text-secondary mb-3">Страница не найдена или временно скрыта</h2>
            
            <p class="text-muted mb-5 px-3">
                Запрашиваемый товар еще не опубликован модераторами, распродан или адрес страницы указан неверно. 
                Проверьте ссылку или вернитесь на главную страницу каталога.
            </p>
            
            <!-- Кнопки действий -->
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{% url 'catalog:product_list' %}" class="btn btn-primary btn-lg px-4 gap-3 shadow-sm">
                    В каталог товаров
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary btn-lg px-4">
                    Назад
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
